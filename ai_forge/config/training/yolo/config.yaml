experiment:
  name: yolo11n_text_detect
  seed: 42
  device: auto
  deterministic: false
  output_dir: model_checkpoint/pt/yolo

model:
  weights: yolo11n
  task: detect
  pretrained: true

data:
  config: data/object_detect/data.yaml
  cache: false

training:
  epochs: 300
  imgsz: 640
  batch: 4
  workers: 2
  patience: 30
  amp: true
  val: true
  resume: false
  close_mosaic: 10

optimizer:
  name: AdamW
  lr0: 0.001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0001
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  cos_lr: true

augmentation:
  enabled: true
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0

save:
  project: model_checkpoint/pt/yolo
  run_name: exp
  exist_ok: false
  save: true
  save_period: 1
  plots: true

evaluation:
  conf: 0.25
  iou: 0.7
  max_det: 300
  half: false

tracking:
  tensorboard: true
  wandb: false
  mlflow: false
