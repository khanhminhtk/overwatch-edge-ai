apiVersion: v1
kind: Service
metadata:
  name: minio-service
spec:
  selector:
    app: minio-service
  ports:
    - name: grpc
      port: 50001
      targetPort: 50001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: minio-service
  template:
    metadata:
      labels:
        app: minio-service
    spec:
      containers:
        - name: minio-service
          image: ghcr.io/your-org/backend-nexus-minio-service:0.1.0
          ports:
            - containerPort: 50001
              name: grpc
          env:
            - name: MINIO_ENDPOINT
              value: minio:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_SECRET_KEY
            - name: MINIO_SESSION_TOKEN
              value: ""
            - name: MINIO_USE_SSL
              value: "false"
            - name: MINIO_REGION
              value: us-east-1
            - name: MINIO_HEALTH_CHECK
              value: "true"
            - name: MINIO_INSECURE_SKIP_TLS
              value: "true"
            - name: MINIOSERVICE_GRPC_PORT
              value: "50001"
            - name: MINIOSERVICE_GRPC_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: minio-service-secrets
                  key: MINIOSERVICE_GRPC_JWT_SECRET
            - name: MINIOSERVICE_GRPC_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: minio-service-secrets
                  key: MINIOSERVICE_GRPC_REFRESH_TOKEN
            - name: MINIOSERVICE_GRPC_EXPIRES_TIME_ACCESS_TOKEN
              value: "300"
            - name: MINIOSERVICE_GRPC_EXPIRES_TIME_URL_UPLOAD
              value: "300"
            - name: MINIOSERVICE_GRPC_EXPIRES_TIME_URL_DOWNLOAD
              value: "300"
          readinessProbe:
            grpc:
              port: 50001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 50001
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: minio-config
              mountPath: /app/config/minio_config.yaml
              subPath: minio_config.yaml
              readOnly: true
            - name: tls-cert
              mountPath: /app/certs
              readOnly: true
      volumes:
        - name: minio-config
          configMap:
            name: minio-service-config
        - name: tls-cert
          secret:
            secretName: minio-service-tls
