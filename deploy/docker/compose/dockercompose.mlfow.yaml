services:
  mlflow:
    build:
      context: ../../..
      dockerfile: services/object-storage-service/dockerfile.mlflow
      args:
        MLFLOW_BASE_IMAGE: ${MLFLOW_IMAGE:-ghcr.io/mlflow/mlflow:v3.12.0}
    image: ${MLFLOW_CUSTOM_IMAGE:-backend-nexus-mlflow:local}
    restart: ${MLFLOW_RESTART:-unless-stopped}

    env_file:
      - ../../../config/.env

    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      MLFLOW_HOST: ${MLFLOW_HOST:-0.0.0.0}
      MLFLOW_PORT: ${MLFLOW_PORT:-5000}
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-overwatch}
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-supersecretpassword}
      MLFLOW_S3_ENDPOINT_URL: http://host.docker.internal:9000
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      MLFLOW_S3_IGNORE_TLS: ${MLFLOW_S3_IGNORE_TLS:-false}
      MLFLOW_ARTIFACT_BUCKET: ${MLFLOW_ARTIFACT_BUCKET:-mlflow}

    command:
      - /bin/sh
      - -c
      - >
        mlflow server
        --host="$$MLFLOW_HOST"
        --port="$$MLFLOW_PORT"
        --backend-store-uri="postgresql+psycopg2://$$POSTGRES_USER:$$POSTGRES_PASSWORD@$$POSTGRES_HOST:$$POSTGRES_PORT/$$POSTGRES_DB"
        --artifacts-destination="s3://$$MLFLOW_ARTIFACT_BUCKET/artifacts"
        --serve-artifacts

    volumes:
      - mlflow-data:/mlflow

    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://localhost:5000/health', timeout=3)\nPY"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

volumes:
  mlflow-data:
