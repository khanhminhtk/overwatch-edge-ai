experiment:
  name: yolo26n_text_detect
  seed: 42
  device: auto
  deterministic: false
  output_dir: artifacts/detection

model:
  weights: yolo26n.pt
  task: detect
  pretrained: true

data:
  config: data/detection/data.yaml
  cache: true

training:
  epochs: 80
  imgsz: 640
  batch: 64
  workers: 8
  patience: 20
  amp: true
  val: true
  resume: false
  close_mosaic: 0

optimizer:
  name: AdamW
  lr0: 0.0003
  lrf: 0.1
  momentum: 0.937
  weight_decay: 0.0001
  warmup_epochs: 1.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.01
  cos_lr: true


augmentation:
  enabled: true
  hsv_h: 0.005
  hsv_s: 0.3
  hsv_v: 0.2
  degrees: 0.0
  translate: 0.05
  scale: 0.2
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.0
  mosaic: 0.0
  mixup: 0.0
  copy_paste: 0.0

save:
  project: data/checkpoint
  run_name: yolo
  exist_ok: false
  save: true
  save_period: 1
  plots: true

evaluation:
  conf: 0.25
  iou: 0.7
  max_det: 300
  half: false

tracking:
  tensorboard: true
  wandb: false
  mlflow: false
