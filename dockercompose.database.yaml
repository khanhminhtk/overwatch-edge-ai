services:
  minio:
    image: minio/minio
    container_name: minio_overwatch
    restart: unless-stopped

    volumes:
      - minio_data:/data

    env_file:
      - config/.env

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

    ports:
      - "${MINIO_API_DOCKER_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_DOCKER_PORT:-http://localhost:9001}:9001"

    command: server /data --console-address ":9001"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - database_network

volumes:
  minio_data:

networks:
  database_network:
    driver: bridge